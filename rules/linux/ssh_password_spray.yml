id: lnx-ssh-password-spray
title: SSH password spraying across many accounts
status: stable
author: mini-siem
description: |
  One source IP failed to log in to four or more different accounts within ten
  minutes. Spraying tries a few common passwords against many usernames to stay
  under per-account lockout limits.
level: high
tags: [attack.credential_access, attack.t1110.003]
logsource:
  source: linux_auth
detection:
  selection:
    event.action: ssh_login
    event.outcome: failure
  condition: selection
threshold:
  count: 4
  distinct: user.name
  timeframe: 10m
  group_by: [source.ip]
falsepositives:
  - A jump host shared by several users who all mistype their passwords
references:
  - https://attack.mitre.org/techniques/T1110/003/
