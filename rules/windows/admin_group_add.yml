id: win-admin-group-add
title: Member added to a privileged Windows group
status: stable
author: mini-siem
description: An account was added to Administrators, Domain Admins or another highly privileged group.
level: high
tags: [attack.persistence, attack.privilege_escalation, attack.t1098]
logsource:
  source: windows_security
detection:
  selection:
    event.code: [4728, 4732, 4756]
    group.name:
      - Administrators
      - Domain Admins
      - Enterprise Admins
      - Schema Admins
      - Backup Operators
      - Account Operators
  condition: selection
falsepositives:
  - Approved privileged access requests
references:
  - https://attack.mitre.org/techniques/T1098/
