id: win-password-spray
title: Windows password spraying
status: stable
author: mini-siem
description: One source IP failed to log on as five or more different accounts within ten minutes.
level: high
tags: [attack.credential_access, attack.t1110.003]
logsource:
  source: windows_security
detection:
  selection:
    event.code: 4625
  condition: selection
threshold:
  count: 5
  distinct: user.name
  timeframe: 10m
  group_by: [source.ip]
falsepositives:
  - Terminal servers or VPN concentrators where many users share one source IP
references:
  - https://attack.mitre.org/techniques/T1110/003/
